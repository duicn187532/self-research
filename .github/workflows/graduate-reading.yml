name: Graduate paper reading checks

on:
  pull_request:
    paths:
      - "index.html"
      - "compare/**"
      - "assets/**"
      - "papers/**"
      - "scripts/**"
      - ".github/workflows/graduate-reading.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "compare/**"
      - "assets/**"
      - "papers/**"
      - "scripts/**"
      - ".github/workflows/graduate-reading.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Internal links and chapter anchors
        run: python3 scripts/check_links.py
      - name: Graduate reading lab integrity and source flags
        run: |
          python3 scripts/check_reading_lab.py
          python3 scripts/source_status.py --check
      - name: JavaScript syntax and interactive behavior
        run: |
          node --check assets/reading-lab.js
          node --check assets/compare-mobile.js
          node --check assets/site.js
          node --check assets/study-sync.js
          node --check assets/battle.js
          node --check assets/quest.js
          node --check assets/world.js
          node --check assets/world-quests.js
          node scripts/test_reading_lab.js
          node scripts/test_study_profile.js
          node scripts/test_note_awards.js
          node scripts/test_math_typeset.js
          node scripts/test_study_sync_recovery.js
          node scripts/test_intro_quest.js
          node scripts/test_storage_failure.js
          node scripts/test_backup_merge.js
          node scripts/test_battle_persistence.js
          node scripts/test_shelf_progress.js
          node scripts/test_world_learning.js
          node scripts/test_world_quests.js
      - name: Existing quiz bank correctness
        run: python3 scripts/quiz/build.py
      - name: Verify quiz outputs remain deterministic
        run: git diff --exit-code -- 'papers/*/quiz.js'
